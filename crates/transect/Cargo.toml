[package]
name = "transect"
# The registry metadata crates.io shows (decision 0010); description, keywords,
# categories and readme are also what clippy's cargo_common_metadata requires.
description = "The Rust client API of Transect's in-application client."
keywords = ["transect", "client", "observability"]
categories = ["development-tools"]
readme = "README.md"
documentation = "https://docs.rs/transect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

# The workspace lint policy (decision 0004).
[lints]
workspace = true

# The release's replacements, here on one crate so they run once per release
# under consolidate-commits; paths are relative to this manifest. Each must match
# exactly once, so a file that changed shape stops the release instead of being
# skipped.
[package.metadata.release]
pre-release-replacements = [
  { file = "../transectpy/pyproject.toml", search = '(?m)^version = "[0-9]+\.[0-9]+\.[0-9]+"$', replace = 'version = "{{version}}"', exactly = 1 },
  { file = "../../fuzz/Cargo.toml", search = 'libtransect = \{ path = "\.\./crates/libtransect", version = "[0-9]+\.[0-9]+\.[0-9]+" \}', replace = 'libtransect = { path = "../crates/libtransect", version = "{{version}}" }', exactly = 1 },
  { file = "../../CHANGELOG.md", search = '(?m)^## \[Unreleased\]\n', replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}\n", exactly = 1 },
]

[dependencies]
# The client depends on the core, never the reverse.
libtransect = { workspace = true }

# The same `--cfg docsrs` and features `just doc` builds with, so a docs.rs build
# would match the gate.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]
