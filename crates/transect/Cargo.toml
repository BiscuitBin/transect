[package]
name = "transect"
# description, keywords and categories are the metadata the clippy cargo group's
# cargo_common_metadata names. It skips a `publish = false` package, so they are
# kept for the docs and for ticket 14, which settles publishing.
description = "The Rust client API of Transect's in-application client."
keywords = ["transect", "client", "tables"]
categories = ["development-tools"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

# The workspace lint policy: the never-raise rule's enforcement.
[lints]
workspace = true

[dependencies]
# The client depends on the core, never the reverse.
libtransect = { workspace = true }

# The same `--cfg docsrs` and features `just doc` builds with, so a docs.rs build
# would match the gate.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]
