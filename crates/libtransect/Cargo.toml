[package]
name = "libtransect"
# The registry metadata crates.io shows (decision 0010); description, keywords,
# categories and readme are also what clippy's cargo_common_metadata requires.
description = "The core of Transect's in-application client."
keywords = ["transect", "client", "observability"]
categories = ["development-tools"]
readme = "README.md"
documentation = "https://docs.rs/libtransect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

# The workspace lint policy (decision 0004).
[lints]
workspace = true

[dev-dependencies]
divan = { workspace = true }

[[bench]]
name = "version"
harness = false

# The same `--cfg docsrs` and features `just doc` builds with, so a docs.rs build
# would match the gate.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]
