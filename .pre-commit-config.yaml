# The read-only gate: installed as the commit hook by `just install-hooks` and
# run whole by `just lint`. It may report but never repair; every fixer lives
# in .pre-commit-fix.yaml, which `just fix` alone runs.
#
# Generated output, environments, scratch and lockfiles have other owners.
# pixi.lock is YAML, so without its line the builtin check-yaml would parse
# the whole lockfile on every commit. .scratch/ holds ticket scratch that
# stays tracked although .gitignore lists it.
exclude: >-
  (?x)^(
    \.git/|
    \.pixi/|
    \.scratch/|
    ai_tmp/|
    target/|
    \.tools/|
    dist/|
    fuzz/target/|
    Cargo\.lock$|
    fuzz/Cargo\.lock$|
    pixi\.lock$
  )
repos:
  - repo: local
    hooks:
      # Repository gates run through `just`: a git hook does not inherit the
      # Justfile's PATH, so routing through the recipe is what lets a hook find
      # the pixi environment's tools, and it keeps each tool's arguments in
      # exactly one place. Clippy is deliberately not a hook: a cold build
      # blocks every commit for minutes, so it is a gate in `just check` and a
      # CI step instead.
      - id: fmt-check
        name: rustfmt check
        entry: just fmt-check
        language: system
        pass_filenames: false
        files: ^((crates|fuzz)/.*\.rs|rustfmt\.toml)$

      - id: toml-check
        name: taplo format and lint
        entry: just toml-check
        language: system
        pass_filenames: false
        types: [toml]

      - id: deps-unused
        name: Unused dependencies
        entry: just deps-unused
        language: system
        pass_filenames: false
        files: ^(Cargo\.toml|(crates/[^/]+|fuzz)/Cargo\.toml|(crates|fuzz)/.*\.rs)$

      - id: py-lint
        name: py-lint
        entry: just py-lint
        language: system
        pass_filenames: false
        files: ^(.*\.pyi?|ruff\.toml)$

      - id: py-typecheck
        name: py-typecheck
        entry: just py-typecheck
        language: system
        pass_filenames: false
        files: ^(.*\.pyi?|mypy\.ini)$

      # The handbook contract. Run through pixi as its activator, because a
      # git hook does not inherit the Justfile's PATH and the recipe that could
      # provide it (check-docs) runs prek inside prek. `--frozen` because a bare
      # `pixi run` may rewrite pixi.lock from inside a commit.
      - id: validate-docs
        name: Documentation contract
        entry: pixi run --frozen bg-validate-docs
        language: system
        pass_filenames: false
        files: ^(README\.md|docs/|pyproject\.toml$)

      # The agent contract, run through pixi for the reason validate-docs gives.
      - id: validate-agents
        name: Agent instruction contract
        entry: pixi run --frozen bg-validate-agents
        language: system
        pass_filenames: false
        files: ^(AGENTS\.md|CLAUDE\.md|\.agents/|\.claude/|\.codex/|\.github/copilot-instructions\.md|pyproject\.toml$)

      # The UNDECIDED markers and the open-decisions register agree.
      - id: check-undecided
        name: UNDECIDED markers match the register
        entry: just check-undecided
        language: system
        pass_filenames: false
        files: ^(crates/.*\.rs|docs/project/open-decisions\.md|scripts/check_undecided\.py)$

  - repo: builtin
    hooks:
      - id: check-added-large-files
        args: [--maxkb=768]
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      # end-of-file-fixer and trailing-whitespace live in .pre-commit-fix.yaml.
      # This config is the read-only gate, so it may report but never repair;
      # editorconfig-checker and markdownlint report the same defects here.

  # The checker's own repository, not the npm wrapper that shares its name.
  # That wrapper ships no binary: it fetches the newest release on first run,
  # an unpinned dependency inside the gate, and it races when prek hands a
  # hook's files to several processes at once. A `rev` pins the checker like
  # every other third-party hook here, built once before any file is read.
  - repo: https://github.com/editorconfig-checker/editorconfig-checker
    rev: 8d927e9944e58ac188c2d3a705a432157983113f # v3.11.3
    hooks:
      # Upstream declares no `types`, which would widen this to every file in
      # the repository. Text is what this gate reads.
      - id: editorconfig-checker
        name: EditorConfig
        types: [text]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: 341e2a331ba578029e66c2e01183e7a6b5ca9ab4 # v0.24.0
    hooks:
      - id: markdownlint-cli2
        name: markdownlint

  - repo: https://github.com/crate-ci/typos
    rev: 7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1
    hooks:
      - id: typos
        # Upstream's hook passes --write-changes, so a misspelling found here
        # would be rewritten in place. This config is the read-only gate:
        # report only.
        args: [--force-exclude]

  - repo: https://github.com/lycheeverse/lychee
    rev: 2bba271688c1abb1503097a064e6c3bc1d1b6a9b # lychee-v0.24.2
    hooks:
      # LYCHEE_VERSION must lead the arguments, and must match the rev comment
      # above. Left to itself the hook derives the version by running
      # `git describe` inside its own cached checkout, but Git exports GIT_DIR
      # to every hook it runs, so during a real commit that describe resolves
      # against this repository instead, finds no `lychee-v*` tag, and exits
      # 100. Passing the version is the escape hatch the hook script offers.
      - id: lychee
        args:
          [
            LYCHEE_VERSION=0.24.2,
            --offline,
            --cache,
            --config,
            lychee.toml,
            --no-progress,
            --root-dir,
            .
          ]
        types: [markdown]
      - id: lychee
        alias: lychee-online
        name: Lychee online (manual)
        args: [LYCHEE_VERSION=0.24.2, --cache, --config, lychee.toml, --no-progress, --root-dir, .]
        types: [markdown]
        stages: [manual]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95 # v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
    hooks:
      - id: actionlint
        files: ^\.github/workflows/.*\.ya?ml$

  # The secret scan. The hook builds ripsecrets; the entry is the shared
  # tooling package's wrapper, which runs it and suppresses its output, so a
  # matched credential is never copied into a log.
  - repo: https://github.com/sirwart/ripsecrets
    rev: 7d94620933e79b8acaa0cd9e60e9864b07673d86 # v0.1.11
    hooks:
      - id: ripsecrets
        entry: .pixi/envs/default/bin/bg-ripsecrets
