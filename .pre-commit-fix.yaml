# Mutating counterpart to .pre-commit-config.yaml. Never installed as a hook;
# run it explicitly with `just fix`.
exclude: >-
  (?x)^(
    \.git/|
    \.pixi/|
    \.scratch/|
    ai_tmp/|
    target/|
    \.tools/|
    tests/fixtures/py-lint-violation/|
    dist/|
    fuzz/target/|
    Cargo\.lock$|
    fuzz/Cargo\.lock$|
    pixi\.lock$
  )
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: rustfmt
        entry: cargo fmt --all
        language: system
        pass_filenames: false
        types: [rust]

      # `just fix` is the only caller, so .pixi/envs/default/bin is already on PATH here.
      - id: taplo-fmt
        name: taplo format
        entry: taplo fmt
        language: system
        types: [toml]

      - id: ruff-format
        name: ruff-format
        entry: .pixi/envs/default/bin/ruff format
        language: system
        files: \.pyi?$

      - id: ruff-fix
        name: ruff-fix
        entry: .pixi/envs/default/bin/ruff check --fix
        language: system
        files: \.pyi?$

      - id: cargo-shear-fix
        name: Remove unused dependencies
        entry: cargo shear --fix
        language: system
        pass_filenames: false

      # The fuzz crate is outside the workspace, so the root run skips it.
      - id: cargo-shear-fix-fuzz
        name: Remove unused dependencies (fuzz)
        entry: cargo shear --fix fuzz
        language: system
        pass_filenames: false

  - repo: builtin
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: 341e2a331ba578029e66c2e01183e7a6b5ca9ab4 # v0.24.0
    hooks:
      - id: markdownlint-cli2
        name: markdownlint fix
        args: [--fix]
        # The config's globs are appended to the files prek passes, so each
        # parallel batch would fix every Markdown file at once and the racing
        # writes corrupt or empty them. One process, given the globs alone,
        # fixes each file once.
        pass_filenames: false

  # The gate's typos hook reports only; this one writes the unambiguous
  # corrections, which is all typos ever rewrites.
  - repo: https://github.com/crate-ci/typos
    rev: 7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1
    hooks:
      - id: typos
        name: typos --write-changes
        args: [--force-exclude, --write-changes]
