name: CI

on:
  pull_request:
  push:
    # Quoted because a branch named `true`, `false`, `null`, `on`, or `1.0` is
    # valid to Git but is not a string to a YAML 1.1 parser.
    branches: ['main']
  workflow_dispatch:

# Read-only: nothing here publishes, comments or writes a check of its own.
# The token each step is minted with can do no more than clone this
# repository, which is what a gate needs and all it needs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental artefacts are large and never reused on a fresh runner.
  CARGO_INCREMENTAL: '0'
  CARGO_NET_RETRY: '10'
  RUST_BACKTRACE: '1'

# Linux and macOS, the two supported platforms. `check` runs the whole gate on
# both; the other jobs split the gates so a failure names itself, and run the
# platform-dependent ones on both. `ci-ok`, last, is the one required check: it
# needs every other job, so no job name carries a slash or a space.
jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      # Both platforms report even when one fails, so a platform difference
      # names itself instead of being cancelled.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Cache writes are main-only, so every pull-request run builds cold.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: check
      # The contributor's first-run path, exactly: the setup action above
      # provides pixi and warm caches, and this proves the initialize script
      # itself works from a fresh checkout on both platforms. It installs the
      # hook shim into the runner's .git, which is harmless.
      - run: just initialize
      # The whole gate: the recipes pyproject.toml lists, the worktree
      # snapshotted between each, then check-clean.
      - run: just check

  # The Rust gates, one recipe per step in the gate's order so a failure names
  # itself in the step list. Tests run on both platforms; the other gates
  # inspect source and manifests, which are platform-independent, so they run
  # on Linux only.
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: rust
      # First: it proves the runner's cargo is rustup's proxy on the pinned
      # release before anything builds.
      - run: just check-toolchain
      - run: just lock-check
      - if: runner.os == 'Linux'
        run: just fmt-check
      - if: runner.os == 'Linux'
        run: just toml-check
      - if: runner.os == 'Linux'
        run: just clippy
      # The fuzz crate still builds under cargo-fuzz; clippy above lints it, and
      # this compiles it the way fuzz.yml will.
      - if: runner.os == 'Linux'
        run: just fuzz-build
      - if: runner.os == 'Linux'
        run: just metrics
      - if: runner.os == 'Linux'
        run: just features
      - run: just test
      - if: runner.os == 'Linux'
        run: just snapshots-check
      - if: runner.os == 'Linux'
        run: just doc
      - if: runner.os == 'Linux'
        run: just deps-unused
      # Last in every job that runs recipes: `just check` snapshots the
      # worktree between recipes, and these split jobs do not, so without it a
      # recipe that rewrote a tracked file, or left an untracked one, would
      # pass here and fail locally.
      - run: just check-clean

  # The Python gates on both platforms, in the gate's order. The extension is
  # built twice: in place for the tests and stubtest, then as the release wheel
  # for the smokes.
  python:
    name: python (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: python
      - run: just py-lint
      - run: just py-typecheck
      - run: just py-test
      - run: just py-stubtest
      - run: just wheel-smoke
      - run: just wheel-smoke-floor
      - run: just version-check
      # The wheel wheel-smoke built and smoked, for wheel-smoke-py311. The
      # recipe empties dist/ first, so exactly one wheel is uploaded.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ runner.os }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7
      # For the reason rust's last step gives.
      - run: just check-clean

  # The floor proved without pixi or the setup action: the abi3-py311 wheel
  # each platform's python job built, installed on the runner's own CPython
  # 3.11. Network is allowed here; `--no-index` and `--no-deps` keep the
  # install to the one downloaded file, and `-I` keeps the checkout's sources
  # off the import path.
  wheel-smoke-py311:
    name: wheel-smoke-py311 (${{ matrix.os }})
    needs: [python]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-${{ runner.os }}
          path: dist
      # The venv lives outside the checkout, so the last line can prove the
      # checkout clean the way check-clean does in the jobs that have `just`.
      - run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -c 'import sys; assert sys.version_info[:2] == (3, 11), sys.version'
          "$RUNNER_TEMP/venv/bin/pip" install --no-index --no-deps dist/*.whl
          "$RUNNER_TEMP/venv/bin/python" -I tests/fixtures/smoke/smoke.py
          rm -rf dist
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: coverage
      - run: just coverage
      # Only after the floor passed: the recipe writes lcov.info in its last
      # line, so an upload on failure would fail a second time for the
      # missing file. Seven days is long enough to read a number into a
      # review; nothing downstream consumes it yet.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov
          path: target/llvm-cov/lcov.info
          if-no-files-found: error
          retention-days: 7
      # For the reason rust's last step gives; after the upload, so a failure
      # here still leaves the lcov file to read.
      - run: just check-clean

  deny:
    name: deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: deny
      # Licences, bans and sources are answerable from the registry index
      # `just sync` fetched. Advisories need the RustSec database over the
      # network, so they are `just audit`'s, outside the gate.
      - run: just deny
      # For the reason rust's last step gives.
      - run: just check-clean

  documents:
    name: documents
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: documents
      - run: just lint
      - run: just check-docs
      - run: just check-agents
      - run: just check-undecided
      # For the reason rust's last step gives.
      - run: just check-clean

  # The one required check. It needs every gate job and fails if any of them
  # failed, was cancelled or was skipped, so branch protection names `ci-ok`
  # alone and never changes when a job is added: a new job joins `needs` here.
  # `if: always()` makes it report on a failure instead of being skipped, which
  # is why the step reads `needs.*.result` itself. No checkout, no setup.
  ci-ok:
    name: ci-ok
    needs: [check, rust, python, wheel-smoke-py311, coverage, deny, documents]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
