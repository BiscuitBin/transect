# Every TOML file in the repository, `.config/nextest.toml` included. The excludes are
# load-bearing: the pixi environment's site-packages and the installed tools hold
# TOML that is not this repository's to format.
include = ["**/*.toml"]
# The skills skills-lock.json names are vendored from upstream: neither the
# formatter nor the linter may touch them (decision 0011). Both roots are listed
# because the second is links to the first.
exclude = [
  "target/**",
  ".tools/**",
  ".pixi/**",
  "ai_tmp/**",
  ".scratch/**",
  ".agents/skills/allium/**",
  ".agents/skills/distill/**",
  ".agents/skills/elicit/**",
  ".agents/skills/propagate/**",
  ".agents/skills/tend/**",
  ".agents/skills/weed/**",
  ".agents/skills/witness/**",
  ".claude/skills/allium/**",
  ".claude/skills/distill/**",
  ".claude/skills/elicit/**",
  ".claude/skills/propagate/**",
  ".claude/skills/tend/**",
  ".claude/skills/weed/**",
  ".claude/skills/witness/**",
]

[formatting]
# The same width rustfmt.toml gives Rust.
column_width = 100
# Stated so a reader need not know taplo's defaults: two-space indents, no column
# alignment, and keys and arrays keep the author's order, so comments stay beside
# what they explain.
indent_string = "  "
align_entries = false
reorder_keys = false
reorder_arrays = false

# The one exception: the dependency tables named below are sorted, so a new
# dependency has one place to go and two branches adding different ones rarely
# conflict. A `[target.'cfg(...)'.dependencies]` table is not covered; add its key
# here when one appears.
[[rule]]
include = ["Cargo.toml", "crates/*/Cargo.toml"]
keys = ["dependencies", "dev-dependencies", "build-dependencies", "workspace.dependencies"]

[rule.formatting]
reorder_keys = true
