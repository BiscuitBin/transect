[project]
name = "transect-tooling"
version = "0.1.0"
description = "Repository tooling for transect. Not the crates; see Cargo.toml for those."
requires-python = ">=3.14"
dependencies = []

# pixi owns every tool binary and the Python environment (.pixi/envs/default,
# gitignored; pixi.lock is the pin). rustup owns the compiler: rust is deliberately
# absent here, so the cargo first on a recipe's PATH is still rustup's proxy and
# rust-toolchain.toml is honoured (check-toolchain proves it).
[tool.pixi.workspace]
channels = ["conda-forge"]
# CI is linux-64 and macOS arm64; the maintainer is osx-arm64. osx-64 joins when a
# claim verifies it; win-64 never: the Justfile and initialization script are
# POSIX-only.
platforms = ["linux-64", "osx-arm64"]
requires-pixi = ">=0.84.1"

# Exact pins, each verified on both platforms with `pixi search` on 2026-11-11.
[tool.pixi.dependencies]
# Exact, like every pin here: an unqualified "3.14" would let the linux-64 solve
# pick 3.15.0rc2, and "3.14.*" would let `just lock-upgrade` move the patch level.
python = "==3.14.10"
just = "==1.59.0"
# For tools.txt and tools-source.txt only: cargo-hack and rustqual are not on conda-forge.
cargo-binstall = "==1.26.1"
cargo-nextest = "==0.9.150"
cargo-llvm-cov = "==0.9.1"
taplo = "==0.10.0"
cargo-deny = "==0.20.2"
cargo-insta = "==1.49.0"
# The pin follows conda-forge, not crates.io.
cargo-shear = "==1.13.4"
# A weekly report, never a gate (mutants.yml). conda-forge's build depends on no
# rust, so rustup's cargo stays first on PATH.
cargo-mutants = "==27.1.0"

[tool.pixi.pypi-dependencies]
biscuit-games-tooling = { git = "https://github.com/steven-cutting/biscuit_games_tooling", tag = "v0.3.0" }

# The gate `just check` runs: these recipes in order, the worktree snapshotted
# between each, then check-clean. Each ticket appends its own gates.
[tool.biscuit-games-tooling]
recipes = [
  "check-toolchain",
  "lock-check",
  "fmt-check",
  "toml-check",
  "clippy",
  "fuzz-build",
  "metrics",
  "features",
  "test-doc",
  "coverage",
  "doc",
  "deny",
  "deps-unused",
  "snapshots-check",
]
predicates = {}
